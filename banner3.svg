<style>
.mono{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
.flip{transform-box:fill-box;transform-origin:center;animation:flip 7s ease-in-out infinite}
@keyframes flip{0%,10%{transform:scaleX(1)}13%{transform:scaleX(0)}16%,70%{transform:scaleX(1)}73%{transform:scaleX(0)}76%,100%{transform:scaleX(1)}}
.front{animation:fr 7s linear infinite;opacity:0}
@keyframes fr{0%,12.9%{opacity:0}13%,72.9%{opacity:1}73%,100%{opacity:0}}
.back{animation:bk 7s linear infinite}
@keyframes bk{0%,12.9%{opacity:1}13%,72.9%{opacity:0}73%,100%{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
